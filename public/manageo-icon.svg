<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <defs>
    <linearGradient id="manageoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Speed Trail 1 (Top) -->
    <rect x="50" y="110" width="105" height="26" rx="13" fill="url(#trailGrad)" />

    <!-- Speed Trail 2 (Middle) -->
    <rect x="75" y="155" width="95" height="26" rx="13" fill="url(#trailGrad)" />

    <!-- Speed Trail 3 (Bottom) -->
    <rect x="115" y="200" width="70" height="26" rx="13" fill="url(#trailGrad)" />

    <!-- Shopping Cart Handle and Outline Frame -->
    <path d="M 85 45 
             L 170 45 
             C 178 45 186 50 191 58 
             L 242 150 
             L 370 150 
             C 380 150 388 143 392 133 
             L 415 70 
             C 418 62 426 56 436 56 
             L 440 56 
             C 452 56 460 68 455 79 
             L 412 195 
             C 405 214 387 227 366 227 
             L 215 227 
             C 197 227 181 216 174 200 
             L 125 71 
             L 85 71 
             C 78 71 72 65 72 58 
             C 72 51 78 45 85 45 Z" 
          fill="url(#manageoGrad)" />

    <!-- Cart Basket Interior Cutout / Hollow Stylization -->
    <path d="M 218 80 
             L 395 80 
             L 362 172 
             C 359 180 351 185 342 185 
             L 240 185 
             C 231 185 224 179 220 171 
             Z" 
          fill="#ffffff" 
          opacity="0.95" />

    <!-- Left Wheel -->
    <circle cx="230" cy="265" r="28" fill="url(#manageoGrad)" />

    <!-- Right Wheel -->
    <circle cx="350" cy="265" r="28" fill="url(#manageoGrad)" />
  </g>
</svg>

